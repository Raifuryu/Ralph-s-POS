services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      # Overrides .env.local's MARIADB_HOST (127.0.0.1, for `pnpm dev` run
      # directly on the host) — from inside the container, 127.0.0.1 means
      # the container itself, not your host machine. host.docker.internal
      # is Docker's special DNS name for reaching the host's own network,
      # which is where your existing MariaDB instance is listening.
      # If your MariaDB actually lives on a different machine instead,
      # change this to that machine's real hostname/IP.
      MARIADB_HOST: host.docker.internal
      NODE_ENV: production
      PORT: "2999"
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (Mac/Windows);
      # this makes it resolve on Linux too.
      - "host.docker.internal:host-gateway"
    ports:
      - "2999:2999"
